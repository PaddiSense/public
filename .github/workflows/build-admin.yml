name: Build PaddiSense Admin

# Mirrors build-sugarsense.yml — workflow_dispatch + repository_dispatch.
# Per Golden Rule 36: prod boxes pull GHCR images, never git clone.
# Source lives in PaddiSense/Admin (private); built image lives at
# ghcr.io/paddisense/{arch}-paddisense-admin and is referenced from
# the public manifest in paddisense-admin/config.yaml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 2026.5.3). Leave empty to read from config.yaml."
        required: false
  repository_dispatch:
    types: [build-admin]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/paddisense

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/Admin
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: source

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.client_payload.version }}" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
          else
            V=$(grep '^version:' source/paddisense-admin/config.yaml | sed 's/version: *"\(.*\)"/\1/')
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: source/paddisense-admin
          file: source/paddisense-admin/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-admin:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-admin:latest
          cache-from: type=gha,scope=admin-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=admin-${{ matrix.arch }}
