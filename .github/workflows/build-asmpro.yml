name: Build ASM Pro

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build"
        required: true
  repository_dispatch:
    types: [build-asmpro]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/paddisense

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    # Postgres for pytest — tests use psycopg2 + RealDictCursor, schema
    # is applied on app startup via _db.ensure_database() (idempotent).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homeassistant
          POSTGRES_DB: asmpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ASM_DB_HOST: localhost
      ASM_DB_PORT: "5432"
      ASM_DB_NAME: asmpro
      ASM_DB_USER: postgres
      ASM_DB_PASSWORD: homeassistant

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/ASM-Pro
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r source/asm-pro/requirements.txt
          pip install ruff mypy bandit pytest httpx types-psycopg2 types-requests types-qrcode

      - name: Gate 1 — Ruff lint (HARD)
        working-directory: source/asm-pro
        run: ruff check asmpro

      - name: Gate 2 — Mypy type check (HARD)
        working-directory: source/asm-pro
        run: mypy asmpro

      - name: Gate 3 — Bandit security scan (HARD — zero HIGH)
        working-directory: source/asm-pro
        run: |
          out=$(bandit -r asmpro -ll -q 2>&1 || true)
          echo "$out"
          high=$(echo "$out" | awk '/Severity: High/ {n++} END {print n+0}')
          if [ "$high" -gt 0 ]; then
            echo "FAIL: $high HIGH severity finding(s)"
            exit 1
          fi

      - name: Gate 4 — Pytest (HARD)
        working-directory: source/asm-pro
        run: pytest tests/ --tb=short -q

  build:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/ASM-Pro
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: source

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.client_payload.version }}" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep '^version:' source/asm-pro/config.yaml | sed 's/version: *"\(.*\)"/\1/')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: source/asm-pro
          file: source/asm-pro/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-asm-pro:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-asm-pro:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max