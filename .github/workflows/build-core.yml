name: Build PaddiSense Core

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build"
        required: true
  repository_dispatch:
    types: [build-core]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/paddisense

jobs:
  # Golden Rules [RELEASE] gate (red-team Wave 3 / Rule 100/155). Runs the DB-free
  # pre-release-audit gates (lint/type/SAST/CVE/theme/audit-currency/193.3) against the
  # exact released source before the image builds. Reuses the least-priv read-only SRC_READ_PAT (R160) —
  # no new secret, no GitHub paid feature (it's a needs: dependency, not branch protection).
  # PS_CI=1 → pytest + session markers skipped (no DB / no session in CI); they stay dev-box gates.
  # PILOT on Core; rolls to the other build-*.yml once validated (steward, WR-PS-047).
  quality-gate:
    # Fleet-standard CODE gate (WR-PS-060): ruff + PINNED mypy + bandit. Pinned mypy means
    # local (release.sh) == CI. Comprehensive doc/theme/security audit is the RELEASE gate
    # (release.sh + dev-box pre-release-audit, Rule 105) — not here.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/Core
          ref: main
          token: ${{ secrets.SRC_READ_PAT }}
          path: source
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned tools + deps
        run: |
          python -m pip install --upgrade pip
          pip install -r source/paddisense-core/requirements.txt
          pip install ruff mypy bandit types-requests types-PyYAML
      - name: Ruff lint (pinned)
        run: ruff check source/paddisense-core/paddicore
      - name: Mypy type check (pinned — local == CI)
        working-directory: source/paddisense-core
        run: mypy paddicore --ignore-missing-imports
      - name: Bandit security scan
        run: bandit -r source/paddisense-core/paddicore -ll -q || true

  build:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # R197: keyless cosign signing via GitHub OIDC

    strategy:
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/Core
          ref: main
          token: ${{ secrets.SRC_READ_PAT }}
          path: source

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.client_payload.version }}" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep '^version:' source/paddisense-core/config.yaml | sed 's/version: *"\(.*\)"/\1/')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache month (monthly rotation — a fresh apt/pip layer at least once a month)
        id: cachemonth
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build            # R197: exposes steps.build.outputs.digest
        uses: docker/build-push-action@v6
        with:
          context: source/paddisense-core
          file: source/paddisense-core/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-core:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-core:latest
          cache-from: type=gha,scope=paddisense-core-${{ matrix.arch }}-${{ steps.cachemonth.outputs.m }}
          cache-to: type=gha,scope=paddisense-core-${{ matrix.arch }}-${{ steps.cachemonth.outputs.m }},mode=max

      # ── WR-PS-819 row 1 (R155) — scan the IMAGE JUST PUSHED, this arch's own digest (Peter ruled option (b) 2026-10-02;
      #    P prior sign-off 2026-10-10, C1-C3). Nothing scanned the built image before: the SBOM below reads the build
      #    CONTEXT, so the base image's OS packages were covered by nothing. Trivy reads the registry manifest for the
      #    digest, so the amd64 runner scans the aarch64 image without running it.
      #    C1: REPORT-ONLY (PS_IMAGE_SCAN_ENFORCE=0) until this add-on's first report is read and triaged — then "1".
      #    C2: the scanner is a pinned release binary verified by checksum, never a moving action tag.
      - name: Scan the pushed image for CVEs (trivy image — report-only until triaged)
        env:
          IMG: ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-core@${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          TRIVY_VERSION: "0.75.0"
          TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PS_IMAGE_SCAN_ENFORCE: "0"
          PS_IMAGE_SCAN_SEVERITY: "HIGH,CRITICAL"
        run: |
          set -uo pipefail
          enforce="${PS_IMAGE_SCAN_ENFORCE:-0}"
          na() {   # the scan could not run: never a pass — blocks when enforcing, a loud warning while report-only
            echo "::warning::image CVE scan NOT ASSESSED for $IMG — $1"
            [ "$enforce" = "1" ] && { echo "::error::image CVE scan could not run and this add-on ENFORCES it"; exit 1; }
            exit 0
          }
          if [ ! -x ./trivy ]; then
            curl -fsSL --retry 3 -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" || na "trivy download failed"
            echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c - || { echo "::error::trivy checksum mismatch — refusing to run an unverified scanner"; exit 1; }
            tar -xzf trivy.tgz trivy || na "trivy archive unreadable"
          fi
          # exit 10 = fixable findings at the gated severity; any other non-zero = the scan itself failed
          ./trivy image --quiet --platform "$PLATFORM" --scanners vuln --severity "${PS_IMAGE_SCAN_SEVERITY:-HIGH,CRITICAL}" \
            --ignore-unfixed --exit-code 10 --format table "$IMG"
          rc=$?
          case "$rc" in
            0)  echo "image CVE scan: no ${PS_IMAGE_SCAN_SEVERITY:-HIGH,CRITICAL} finding with a fix available in $IMG" ;;
            10) if [ "$enforce" = "1" ]; then
                  echo "::error::image CVE scan: fixable ${PS_IMAGE_SCAN_SEVERITY:-HIGH,CRITICAL} finding(s) in $IMG (table above) — rebuild on a patched base or bump the package"; exit 1
                fi
                echo "::warning::image CVE scan (REPORT-ONLY, WR-PS-819 C1): fixable ${PS_IMAGE_SCAN_SEVERITY:-HIGH,CRITICAL} finding(s) in $IMG — table above. Not blocking until triaged." ;;
            *)  na "trivy exited $rc" ;;
          esac

      # ── R197 image provenance — canonical block (documentation/contracts/R197_PROVENANCE.md;
      #    validated WR-AS-020 / ASM-Pro #77). cosign verify exit = the gate (Rule 192).
      - name: Install cosign + syft
        uses: sigstore/cosign-installer@v3

      - name: Generate CycloneDX SBOM
        # WR-AS-020 finding: scan the build CONTEXT filesystem, not image:@digest — syft on
        # the amd64 runner can't pull an aarch64-only image variant. Filesystem scan is
        # symmetric across arches (trade-off: misses base-image OS packages).
        uses: anchore/sbom-action@v0
        with:
          path: source/paddisense-core
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Sign + attest + verify (fail-closed = the R197 gate)
        env:
          COSIGN_YES: "true"
          IMG: ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-core@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # WR-PS-420: Rekor (Sigstore's transparency log) intermittently 404s on
          # GET /api/v1/log/entries/{entryUUID} right after a signature is submitted —
          # eventual consistency, not a signing fault. It failed two consecutive releases
          # on 2026-08-03, on a DIFFERENT arch each time. Retry only the cosign calls that
          # touch Rekor. Fail-closed is preserved: when attempts are exhausted the failure
          # stands, the step exits non-zero and NO image is published (R197).
          retry() {
            local n=1 max=5 delay=15
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "::error::cosign failed after $max attempts: $*"
                return 1
              fi
              echo "::warning::attempt $n/$max failed (likely Rekor eventual-consistency); retry in ${delay}s"
              n=$((n + 1)); sleep "$delay"; delay=$((delay * 2))
            done
          }
          retry cosign sign "$IMG"
          retry cosign attest --predicate sbom.cdx.json --type cyclonedx "$IMG"
          retry cosign verify "$IMG" \
            --certificate-identity-regexp '^https://github\.com/PaddiSense/public/\.github/workflows/build-.+\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            >/dev/null
          retry cosign verify-attestation "$IMG" --type cyclonedx \
            --certificate-identity-regexp '^https://github\.com/PaddiSense/public/\.github/workflows/build-.+\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            >/dev/null
