name: Build PaddiSense Core

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build"
        required: true
  repository_dispatch:
    types: [build-core]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/paddisense

jobs:
  # Golden Rules [RELEASE] gate (red-team Wave 3 / Rule 100/155). Runs the DB-free
  # pre-release-audit gates (lint/type/SAST/CVE/theme/audit-currency/193.3) against the
  # exact released source before the image builds. Reuses the existing PRIVATE_REPO_PAT —
  # no new secret, no GitHub paid feature (it's a needs: dependency, not branch protection).
  # PS_CI=1 → pytest + session markers skipped (no DB / no session in CI); they stay dev-box gates.
  # PILOT on Core; rolls to the other build-*.yml once validated (steward, WR-PS-047).
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/Core
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: source
      - name: Checkout contracts (documentation)
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/documentation
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: documentation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools + addon deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit pip-audit
          pip install -r source/paddisense-core/requirements.txt || true
      - name: Pre-release audit (CI mode)
        working-directory: source/paddisense-core
        env:
          PS_CI: "1"
          PS_CONTRACTS_DIR: ${{ github.workspace }}/documentation/contracts
          PS_THEME_MASTER: ${{ github.workspace }}/documentation/theme/paddisense-tokens.css
        run: sh "$GITHUB_WORKSPACE/documentation/contracts/pre-release-audit.sh" paddicore

  build:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/Core
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: source

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.client_payload.version }}" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep '^version:' source/paddisense-core/config.yaml | sed 's/version: *"\(.*\)"/\1/')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: source/paddisense-core
          file: source/paddisense-core/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-core:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
