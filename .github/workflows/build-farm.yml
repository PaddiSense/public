name: Build PaddiSense Farm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build"
        required: true
      ref:
        description: "Source: main (default) or a 40-hex commit sha (WR-PS-577 hotfix)"
        required: false
        default: main
      theme_ref:
        description: "Documentation theme: 40-hex sha, REQUIRED when ref is a sha (the base's gate_revision)"
        required: false
        default: ""
  repository_dispatch:
    types: [build-farm]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/paddisense

jobs:
  source-ref:
    # WR-PS-577 slice 5 (A §5.3 2026-11-27): ONE resolution of what is built. `main` (the default, every normal cut) or a
    # 40-hex commit sha (a hotfix, release.sh --hotfix) — a moving branch name is refused, so the build is exactly the
    # commit release.sh pinned. The value is read through env, never pasted into the script (no injection).
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ref: ${{ steps.r.outputs.ref }}
      is_main: ${{ steps.r.outputs.is_main }}
      theme_ref: ${{ steps.r.outputs.theme_ref }}
    steps:
      - name: Resolve the source ref (main, or a 40-hex sha — never a branch name)
        id: r
        env:
          IN_REF: ${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}
          IN_THEME: ${{ github.event.inputs.theme_ref || github.event.client_payload.theme_ref || '' }}
        run: |
          # P's T2 2026-11-27: WHOLE-STRING tests only — `grep` matches per line, so "<sha>\nref=main" passed and wrote a
          # second ref= / is_main= into GITHUB_OUTPUT. Every value written below is a literal or passed is_sha.
          is_sha() { case "$1" in ''|*[!0-9a-f]*) return 1;; esac; [ "${#1}" -eq 40 ]; }
          shown() { printf '%s' "$1" | tr -c '0-9A-Za-z._/-' '?' | cut -c1-60; }   # never echo a raw input
          if [ "$IN_REF" = main ]; then
            [ -z "$IN_THEME" ] || [ "$IN_THEME" = main ] || { echo "::error title=source_ref::a main build takes the theme from main (got theme_ref '$(shown "$IN_THEME")')"; exit 1; }
            echo "ref=main" >> "$GITHUB_OUTPUT"; echo "is_main=true" >> "$GITHUB_OUTPUT"
            echo "theme_ref=main" >> "$GITHUB_OUTPUT"
          elif is_sha "$IN_REF"; then
            # A 2026-11-27: a hotfix ships the theme its BASE shipped (the base receipt's gate_revision), never today's
            is_sha "$IN_THEME" || { echo "::error title=source_ref::a sha build needs theme_ref = the base's gate_revision (40-hex; got '$(shown "$IN_THEME")')"; exit 1; }
            echo "ref=$IN_REF" >> "$GITHUB_OUTPUT"; echo "is_main=false" >> "$GITHUB_OUTPUT"
            echo "theme_ref=$IN_THEME" >> "$GITHUB_OUTPUT"
            echo "::notice title=source_ref::building commit $IN_REF (not main) — no :latest tag"
          else
            echo "::error title=source_ref::ref must be 'main' or a 40-hex commit sha (got '$(shown "$IN_REF")')"; exit 1
          fi

  quality-gate:
    needs: source-ref
    # Fleet-standard CODE gate (WR-PS-060): ruff + PINNED mypy + bandit. Pinned mypy means
    # local (release.sh) == CI — the drift that let Core ship a build that then failed.
    # The comprehensive doc/theme/security audit is the RELEASE gate (release.sh + dev-box
    # pre-release-audit, Rule 105) — NOT here, so a stale AUDIT.md never blocks a build.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/Farm
          ref: ${{ needs.source-ref.outputs.ref }}
          token: ${{ secrets.SRC_READ_PAT }}
          path: source
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned tools + deps
        run: |
          python -m pip install --upgrade pip
          # ADR-026 P7: requirements.txt pins the vendored wheel as ./vendor/wheels/… — relative to the ADD-ON root, so install from there
          (cd source/paddisense-farm && pip install -r requirements.txt)
          pip install ruff mypy bandit types-requests types-PyYAML
      - name: Ruff lint (pinned)
        run: ruff check source/paddisense-farm/paddisense_farm
      - name: Mypy type check (pinned — local == CI)
        working-directory: source/paddisense-farm
        run: mypy paddisense_farm --ignore-missing-imports
      - name: Bandit security scan
        run: bandit -r source/paddisense-farm/paddisense_farm -ll -q || true

  image-test:
    # WR-PS-1066 (A's stage, docs contracts/image-test/): the add-on's image_only tests + the step 3.9.1 measures run INSIDE
    # the image just built, on BOTH arches natively (ubuntu-24.04-arm: free for this public repo). Any skip, failure,
    # collect error or zero tests fails this job, and `build` needs it — a red image test stops the release. Nothing here
    # is pushed: the image is built with load, and the test stage is a second throwaway build FROM it.
    needs: [source-ref, quality-gate]
    permissions:
      contents: read
      packages: read           # "image size before" reads this arch's :latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64,   platform: linux/amd64, runner: ubuntu-latest }
          - { arch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm }   # native: real HA Green-class timings
    runs-on: ${{ matrix.runner }}
    env:
      # the image-test stage is a GATE: pinned to a reviewed documentation commit, never a moving branch (bump = gate change)
      IMAGETEST_DOCS_SHA: "73d55f6ca2447c7eedbac8e4b4b32ae42cb9495c"
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/Farm
          ref: ${{ needs.source-ref.outputs.ref }}
          token: ${{ secrets.SRC_READ_PAT }}
          path: source

      - name: Checkout the image-test stage (documentation contracts/image-test, pinned)
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/documentation
          ref: ${{ env.IMAGETEST_DOCS_SHA }}
          token: ${{ secrets.SRC_READ_PAT }}
          path: docs
          sparse-checkout: contracts/image-test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the add-on image (local only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: source/paddisense-farm
          file: source/paddisense-farm/Dockerfile
          build-args: |
            APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ps-imagetest-base:${{ matrix.arch }}

      - name: Log in to GHCR (read, for the size before)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image size, before and after
        env:
          LATEST: ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-farm:latest
          BUILT: ps-imagetest-base:${{ matrix.arch }}
        run: |
          if docker pull "$LATEST" >/dev/null 2>&1; then
            echo "measure: image size before: $(docker image inspect -f '{{.Size}}' "$LATEST") bytes ($LATEST)"
          else
            echo "measure: image size before: NOT MEASURED (no $LATEST)"
          fi
          echo "measure: image size after: $(docker image inspect -f '{{.Size}}' "$BUILT") bytes"

      - name: Image test (fails on any skip, failure, collect error or zero tests)
        # the DAEMON's builder (`--builder default`, the docker driver): it sees the image the step above LOADED. The
        # buildx docker-container builder (which setup-buildx made the default) cannot, and would pull `ps-imagetest-base`
        # from Docker Hub instead.
        env:
          DOCKER_BUILDKIT: "1"
          BASE: ps-imagetest-base:${{ matrix.arch }}
        run: |
          set -o pipefail
          rc=0
          docker buildx build --builder default --progress=plain --platform "${{ matrix.platform }}" \
            -f docs/contracts/image-test/Dockerfile.imagetest \
            --build-arg BASE="$BASE" --build-arg IMAGE_TEST_NATIVE=1 \
            --build-context imagetest=docs/contracts/image-test \
            --build-context addon=source/paddisense-farm \
            . 2>&1 | tee imagetest.log || rc=$?
          # The judge line and the measures as ONE annotation each: readable on the run page without opening the log.
          enc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          # `|| true`: no match must not end the step under bash -e + pipefail before the failure tail is shown
          sum=$(grep -oE '(image test:|measure:).*' imagetest.log | sed -E 's/\x1b\[[0-9;]*m//g' | tail -30 | enc || true)
          [ -n "$sum" ] && echo "::notice title=image test (${{ matrix.arch }})::$sum"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=image test FAILED (${{ matrix.arch }})::$(tail -40 imagetest.log | sed -E 's/\x1b\[[0-9;]*m//g' | cut -c1-300 | enc || true)"
            exit "$rc"
          fi

  build:
    needs: [source-ref, quality-gate, image-test]   # WR-PS-1066: a red image test stops the release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # R197: keyless cosign signing via GitHub OIDC

    strategy:
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/Farm
          ref: ${{ needs.source-ref.outputs.ref }}
          token: ${{ secrets.SRC_READ_PAT }}
          path: source

      - name: Prove the checked-out source (WR-PS-577 slice 5)
        id: src
        env:
          WANT_REF: ${{ needs.source-ref.outputs.ref }}
          WANT_VER: ${{ github.event.inputs.version || github.event.client_payload.version }}
        run: |
          SHA=$(git -C source rev-parse HEAD)
          if [ "$WANT_REF" != main ]; then
            # W7 (P T2 + A 2026-11-27): the sha must be the tip of the pushed hotfix branch, now — never any reachable sha
            case "$WANT_VER" in ''|*[!0-9.]*) echo "::error title=source_ref::version must be digits and dots"; exit 1;; esac
            HEAD_NOW=$(git -C source ls-remote origin "refs/heads/hotfix/paddisense-farm/$WANT_VER" | cut -f1)
            [ -n "$HEAD_NOW" ] || { echo "::error title=source_ref::hotfix/paddisense-farm/$WANT_VER is not on origin — only a pushed hotfix branch builds"; exit 1; }
            [ "$HEAD_NOW" = "$WANT_REF" ] || { echo "::error title=source_ref::hotfix/paddisense-farm/$WANT_VER moved since dispatch; re-run the cut"; exit 1; }
            [ "$SHA" = "$WANT_REF" ] || { echo "::error title=source_ref::checked out $SHA, asked for $WANT_REF"; exit 1; }
            CFG=$(grep '^version:' source/paddisense-farm/config.yaml | sed 's/version: *"\(.*\)"/\1/')
            [ "$CFG" = "$WANT_VER" ] || { echo "::error title=source_ref::config.yaml at $SHA is $CFG, asked to build $WANT_VER"; exit 1; }
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "::notice title=source_sha::$SHA"

      - name: Extract version
        id: version
        env:
          IN_VER: ${{ github.event.inputs.version || github.event.client_payload.version }}
        run: |
          # P T2 2026-11-27 (W8): event values reach a script only through env — never an expression pasted into run
          if [ -n "$IN_VER" ]; then
            V="$IN_VER"
          else
            V=$(grep '^version:' source/paddisense-farm/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          fi
          case "$V" in ''|*[!0-9.]*) echo "::error title=version::the version must be digits and dots"; exit 1;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"


      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache month (monthly rotation — a fresh apt/pip layer at least once a month)
        id: cachemonth
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Image tags (WR-PS-577 slice 5 — :latest only for a main build)
        id: tags
        env:
          IS_MAIN: ${{ needs.source-ref.outputs.is_main }}
          VER_TAG: ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-farm:${{ steps.version.outputs.version }}
          LATEST_TAG: ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-farm:latest
        run: |
          {
            echo "list<<PS_TAGS_EOF"
            echo "$VER_TAG"
            [ "$IS_MAIN" = true ] && echo "$LATEST_TAG"
            echo "PS_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build            # R197: exposes steps.build.outputs.digest
        uses: docker/build-push-action@v6
        with:
          context: source/paddisense-farm
          file: source/paddisense-farm/Dockerfile
          # WR-PS-877: APT_REFRESH is a new key per run (and per re-run), so the apt-upgrade layer never comes from the cache
          build-args: |
            APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: org.opencontainers.image.revision=${{ steps.src.outputs.sha }}
          cache-from: type=gha,scope=paddisense-farm-${{ matrix.arch }}-${{ steps.cachemonth.outputs.m }}
          cache-to: type=gha,scope=paddisense-farm-${{ matrix.arch }}-${{ steps.cachemonth.outputs.m }},mode=max

      # ── WR-PS-819 row 1 (R155) — scan the IMAGE JUST PUSHED, this arch's own digest (Peter ruled option (b) 2026-10-02;
      #    P prior sign-off 2026-10-10, C1-C3). Nothing scanned the built image before: the SBOM below reads the build
      #    CONTEXT, so the base image's OS packages were covered by nothing. Trivy reads the registry manifest for the
      #    digest, so the amd64 runner scans the aarch64 image without running it.
      #    C1: REPORT-ONLY (PS_IMAGE_SCAN_ENFORCE=0) until this add-on's first report is read and triaged — then "1".
      #    C2: the scanner is a pinned release binary verified by checksum, never a moving action tag.
      - name: Scan the pushed image for CVEs (trivy image — report-only until triaged)
        env:
          IMG: ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-farm@${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          TRIVY_VERSION: "0.75.0"
          TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PS_IMAGE_SCAN_ENFORCE: "1"   # Farm: report read 2026-10-18 (run 39107070342 (Farm 10.111), both arches: none fixable) — enforcing (WR-PS-521, Peter 19:4x)
          PS_IMAGE_SCAN_SEVERITY: "HIGH,CRITICAL"
        run: |
          set -uo pipefail
          enforce="${PS_IMAGE_SCAN_ENFORCE:-0}"
          na() {   # the scan could not run: never a pass — blocks when enforcing, a loud warning while report-only
            echo "::warning::image CVE scan NOT ASSESSED for $IMG — $1"
            [ "$enforce" = "1" ] && { echo "::error::image CVE scan could not run and this add-on ENFORCES it"; exit 1; }
            exit 0
          }
          if [ ! -x ./trivy ]; then
            curl -fsSL --retry 3 -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" || na "trivy download failed"
            echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c - || { echo "::error::trivy checksum mismatch — refusing to run an unverified scanner"; exit 1; }
            tar -xzf trivy.tgz trivy || na "trivy archive unreadable"
          fi
          # exit 10 = fixable findings at the gated severity; any other non-zero = the scan itself failed
          # GitHub runs this script with `bash -e`: a bare non-zero exit from trivy would end the step HERE, before the
          # report-only / NOT ASSESSED handling below (found by the WR-PS-819 C3 control run 37996426235: exit code 10).
          rc=0
          ./trivy image --quiet --platform "$PLATFORM" --scanners vuln --severity "${PS_IMAGE_SCAN_SEVERITY:-HIGH,CRITICAL}" \
            --ignore-unfixed --exit-code 10 --format table "$IMG" || rc=$?
          case "$rc" in
            0)  echo "image CVE scan: no ${PS_IMAGE_SCAN_SEVERITY:-HIGH,CRITICAL} finding with a fix available in $IMG" ;;
            10) if [ "$enforce" = "1" ]; then
                  echo "::error::image CVE scan: fixable ${PS_IMAGE_SCAN_SEVERITY:-HIGH,CRITICAL} finding(s) in $IMG (table above) — rebuild on a patched base or bump the package"; exit 1
                fi
                echo "::warning::image CVE scan (REPORT-ONLY, WR-PS-819 C1): fixable ${PS_IMAGE_SCAN_SEVERITY:-HIGH,CRITICAL} finding(s) in $IMG — table above. Not blocking until triaged." ;;
            *)  na "trivy exited $rc" ;;
          esac

      # ── R197 image provenance — canonical block (documentation/contracts/R197_PROVENANCE.md;
      #    validated WR-AS-020 / ASM-Pro #77). cosign verify exit = the gate (Rule 192).
      - name: Install cosign + syft
        uses: sigstore/cosign-installer@v3

      - name: Generate CycloneDX SBOM
        # WR-AS-020 finding: scan the build CONTEXT filesystem, not image:@digest — syft on
        # the amd64 runner can't pull an aarch64-only image variant. Filesystem scan is
        # symmetric across arches (trade-off: misses base-image OS packages).
        uses: anchore/sbom-action@v0
        with:
          path: source/paddisense-farm
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Sign + attest + verify (fail-closed = the R197 gate)
        env:
          COSIGN_YES: "true"
          IMG: ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-farm@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # WR-PS-420: Rekor (Sigstore's transparency log) intermittently 404s on
          # GET /api/v1/log/entries/{entryUUID} right after a signature is submitted —
          # eventual consistency, not a signing fault. It failed two consecutive releases
          # on 2026-08-03, on a DIFFERENT arch each time. Retry only the cosign calls that
          # touch Rekor. Fail-closed is preserved: when attempts are exhausted the failure
          # stands, the step exits non-zero and NO image is published (R197).
          retry() {
            local n=1 max=5 delay=15
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "::error::cosign failed after $max attempts: $*"
                return 1
              fi
              echo "::warning::attempt $n/$max failed (likely Rekor eventual-consistency); retry in ${delay}s"
              n=$((n + 1)); sleep "$delay"; delay=$((delay * 2))
            done
          }
          retry cosign sign "$IMG"
          retry cosign attest --predicate sbom.cdx.json --type cyclonedx "$IMG"
          retry cosign verify "$IMG" \
            --certificate-identity-regexp '^https://github\.com/PaddiSense/public/\.github/workflows/build-.+\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            >/dev/null
          retry cosign verify-attestation "$IMG" --type cyclonedx \
            --certificate-identity-regexp '^https://github\.com/PaddiSense/public/\.github/workflows/build-.+\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            >/dev/null
