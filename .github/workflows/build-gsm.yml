name: Build GSM Server

# ADR-004 Phase A — builds the GSM addon's container image and pushes
# it to private GHCR. Same shape as build-asmpro.yml / build-safety.yml
# (canonical pattern: workflow in paddisense-public, source checked out
# from the private repo via SRC_READ_PAT (least-priv read-only, R160), multi-arch matrix build).
#
# Triggered by:
#   - repository_dispatch event_type=build-gsm  (canonical, Peter fires
#     this after dev-verify per Rule 81 strict order)
#   - workflow_dispatch                          (manual fallback)
#
# NOT triggered by tag push or branch push — feedback_rule_103
# enforces "source repo never holds a GHCR push workflow."

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 2026.5.270). Defaults to source config.yaml."
        required: false
      ref:
        description: "Source: main (default) or a 40-hex commit sha (WR-PS-577 hotfix)"
        required: false
        default: main
      theme_ref:
        description: "Documentation theme: 40-hex sha, REQUIRED when ref is a sha (the base's gate_revision)"
        required: false
        default: ""
  repository_dispatch:
    types: [build-gsm]

env:
  REGISTRY:   ghcr.io
  IMAGE_BASE: ghcr.io/paddisense

jobs:
  source-ref:
    # WR-PS-577 slice 5 (A §5.3 2026-11-27): ONE resolution of what is built. `main` (the default, every normal cut) or a
    # 40-hex commit sha (a hotfix, release.sh --hotfix) — a moving branch name is refused, so the build is exactly the
    # commit release.sh pinned. The value is read through env, never pasted into the script (no injection).
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ref: ${{ steps.r.outputs.ref }}
      is_main: ${{ steps.r.outputs.is_main }}
      theme_ref: ${{ steps.r.outputs.theme_ref }}
    steps:
      - name: Resolve the source ref (main, or a 40-hex sha — never a branch name)
        id: r
        env:
          IN_REF: ${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}
          IN_THEME: ${{ github.event.inputs.theme_ref || github.event.client_payload.theme_ref || '' }}
        run: |
          # P's T2 2026-11-27: WHOLE-STRING tests only — `grep` matches per line, so "<sha>\nref=main" passed and wrote a
          # second ref= / is_main= into GITHUB_OUTPUT. Every value written below is a literal or passed is_sha.
          is_sha() { case "$1" in ''|*[!0-9a-f]*) return 1;; esac; [ "${#1}" -eq 40 ]; }
          shown() { printf '%s' "$1" | tr -c '0-9A-Za-z._/-' '?' | cut -c1-60; }   # never echo a raw input
          if [ "$IN_REF" = main ]; then
            [ -z "$IN_THEME" ] || [ "$IN_THEME" = main ] || { echo "::error title=source_ref::a main build takes the theme from main (got theme_ref '$(shown "$IN_THEME")')"; exit 1; }
            echo "ref=main" >> "$GITHUB_OUTPUT"; echo "is_main=true" >> "$GITHUB_OUTPUT"
            echo "theme_ref=main" >> "$GITHUB_OUTPUT"
          elif is_sha "$IN_REF"; then
            # A 2026-11-27: a hotfix ships the theme its BASE shipped (the base receipt's gate_revision), never today's
            is_sha "$IN_THEME" || { echo "::error title=source_ref::a sha build needs theme_ref = the base's gate_revision (40-hex; got '$(shown "$IN_THEME")')"; exit 1; }
            echo "ref=$IN_REF" >> "$GITHUB_OUTPUT"; echo "is_main=false" >> "$GITHUB_OUTPUT"
            echo "theme_ref=$IN_THEME" >> "$GITHUB_OUTPUT"
            echo "::notice title=source_ref::building commit $IN_REF (not main) — no :latest tag"
          else
            echo "::error title=source_ref::ref must be 'main' or a 40-hex commit sha (got '$(shown "$IN_REF")')"; exit 1
          fi

  quality-gate:
    needs: source-ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    # Postgres for pytest — GSM's selftest + a handful of integration
    # tests touch the DB. Schema is bootstrapped by gsm.core.db.init_db()
    # on first connection (idempotent), so the test job just needs the
    # cluster reachable.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: homeassistant
          POSTGRES_DB:       gsm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      GSM_DB_HOST:     localhost
      GSM_DB_PORT:     "5432"
      GSM_DB_NAME:     gsm
      GSM_DB_USER:     postgres
      GSM_DB_PASSWORD: homeassistant

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/GrowerServicesManager
          ref: ${{ needs.source-ref.outputs.ref }}
          token: ${{ secrets.SRC_READ_PAT }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (libgeos for shapely, libpq for psycopg2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgeos-dev libpq-dev

      - name: Install runtime + audit toolchain
        run: |
          # ADR-026 P7: requirements.txt pins the vendored wheel as ./vendor/wheels/… — relative to the ADD-ON root, so install from there
          (cd source/gsm-server && pip install -r requirements.txt)
          pip install ruff==0.15.14 mypy==1.16.0 bandit==1.9.1 \
                      pip-audit==2.10.0 pytest==9.0.3 \
                      types-requests types-psycopg2

      - name: Gate 1 — Ruff lint (Rule 85, HARD)
        working-directory: source/gsm-server
        run: ruff check gsm

      - name: Gate 2 — Mypy type check (Rule 65, HARD)
        working-directory: source/gsm-server
        run: mypy gsm

      - name: Gate 3 — Bandit security scan (Rule 88, HARD — zero HIGH)
        working-directory: source/gsm-server
        run: |
          out=$(bandit -r gsm -ll -q 2>&1 || true)
          echo "$out"
          high=$(echo "$out" | awk '/Severity: High/ {n++} END {print n+0}')
          if [ "$high" -gt 0 ]; then
            echo "FAIL: $high HIGH severity finding(s)"
            exit 1
          fi

      - name: Gate 4 — Pip-audit CVE scan (Rule 155, HARD — zero CVE)
        working-directory: source/gsm-server
        # WR-PS-877 (P §5.3 2026-10-27, C1): --strict refuses a dependency that is not on PyPI, and our vendored paddisense_common
        # wheel never is ("Dependency not found on PyPI and could not be audited"), so audit every OTHER line. C1: first prove every
        # Requires-Dist of every vendored wheel is pinned in that audited file, so a new dependency in the next wheel cannot ship unaudited.
        run: |
          grep -v '^\./vendor/wheels/' requirements.txt > "$RUNNER_TEMP/req-audit.txt"
          python3 - "$RUNNER_TEMP/req-audit.txt" vendor/wheels/*.whl <<'PY'
          import re, sys, zipfile
          from pathlib import Path

          def norm(n):
              return re.sub(r"[-_.]+", "-", n).lower()

          audited = set()
          for ln in Path(sys.argv[1]).read_text().splitlines():
              ln = ln.strip()
              if ln and not ln.startswith(("#", "-", ".", "/")):
                  audited.add(norm(re.split(r"[\s=<>!~;\[@]", ln, maxsplit=1)[0]))
          wheels = [w for w in sys.argv[2:] if Path(w).is_file()]
          missing = []
          for whl in wheels:
              with zipfile.ZipFile(whl) as z:
                  meta = [n for n in z.namelist() if n.endswith(".dist-info/METADATA")]
                  if len(meta) != 1:
                      print(f"::error::{whl}: {len(meta)} METADATA files — cannot read its dependencies")
                      sys.exit(1)
                  for ln in z.read(meta[0]).decode().splitlines():
                      if not ln.startswith("Requires-Dist:"):
                          continue
                      spec = ln.split(":", 1)[1].strip()
                      if ";" in spec and "extra" in spec.split(";", 1)[1]:
                          continue          # an optional extra — not installed by a plain `pip install <wheel>`
                      name = norm(re.split(r"[\s=<>!~;\[(@]", spec, maxsplit=1)[0])
                      if name not in audited:
                          missing.append(f"{Path(whl).name} needs {spec!r}, not pinned in the audited requirements")
          for m in missing:
              print(f"::error::{m}")
          print(f"wheel deps audited: {len(wheels)} vendored wheel(s), {len(missing)} dependency(ies) missing from the audit")
          sys.exit(1 if missing else 0)
          PY
          ARGS="-r $RUNNER_TEMP/req-audit.txt --strict"
          if [ -f .pip-audit-skip ]; then
            while IFS= read -r v; do
              case "$v" in ''|\#*) continue ;; esac
              ARGS="$ARGS --ignore-vuln $v"
            done < .pip-audit-skip
          fi
          pip-audit $ARGS

      # Pre-seed runtime paths the addon expects to exist on a real HA box.
      # Two classes of issue surfaced in the v.283 / v.284 build cascade:
      #   1. gsm/rtr.py historically did `Path('/share/uploaded data').mkdir()`
      #      at module-import time. CI runners have no /share and aren't root,
      #      so the import crashed. v.284 lazy-inited; this step also pre-seeds
      #      the dir so any future module-level read/exists check works.
      #   2. gsm.core.db.init_db() is wired to FastAPI startup events, which the
      #      bare TestClient(app) fixture doesn't trigger. v.285 added a
      #      session-scoped conftest fixture; this step pre-seeds the schema
      #      explicitly as belt-and-braces so even a future test that boots
      #      its own TestClient context can rely on a migrated DB.
      # Both steps are belt-and-braces — the v.284 + v.285 code fixes are the
      # primary defence, and these steps keep the next class-of-issue from
      # silently re-emerging.
      - name: Pre-seed runtime paths (R163 keystone — close build-env drift)
        run: |
          sudo mkdir -p '/share/uploaded data'
          sudo chmod 777 /share '/share/uploaded data'
          # v.299+ — GSM persists the admin session secret at
          # /data/keys/admin_session_secret (R145). The auth middleware
          # loads it on the first request, so even a /health smoke test
          # triggers mkdir + write of /data/keys. CI runners don't have
          # /data writable; without this pre-seed, every TestClient(app)
          # test fails with PermissionError. Mirrors the v.283 /share
          # fix — same shape, different runtime path.
          # Other /data subpaths used by the addon at request time:
          # /data/keys, /data/ndvi, /data/event_photos, /data/home,
          # /data/bug_reports.jsonl, /data/release_gate.json, /data/
          # gsm_proxy_webhook_id. Pre-seed /data writable so any future
          # addition is covered without another workflow edit.
          sudo mkdir -p /data/keys /data/ndvi /data/event_photos /data/home
          sudo chmod -R 777 /data

      - name: Pre-seed DB schema (init_db before pytest)
        working-directory: source/gsm-server
        env:
          PYTHONPATH: .
        run: |
          python -c "from gsm.core.db import init_db; init_db(); print('schema bootstrapped')"

      - name: Gate 5 — Pytest (Rule 87, HARD)
        working-directory: source/gsm-server
        run: pytest tests/ --tb=short -q

  build:
    needs: [source-ref, quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write        # R197: keyless cosign signing via GitHub OIDC

    strategy:
      matrix:
        # ADR-004 Phase A scope: amd64 only. SunRice prod + default
        # Azure surfaces are amd64. aarch64 added when a real aarch64
        # host materialises — the matrix structure supports it
        # without further refactor.
        arch: [amd64]
        include:
          - arch:     amd64
            platform: linux/amd64

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/GrowerServicesManager
          ref: ${{ needs.source-ref.outputs.ref }}
          token: ${{ secrets.SRC_READ_PAT }}
          path: source

      - name: Prove the checked-out source (WR-PS-577 slice 5)
        id: src
        env:
          WANT_REF: ${{ needs.source-ref.outputs.ref }}
          WANT_VER: ${{ github.event.inputs.version || github.event.client_payload.version }}
        run: |
          SHA=$(git -C source rev-parse HEAD)
          if [ "$WANT_REF" != main ]; then
            # W7 (P T2 + A 2026-11-27): the sha must be the tip of the pushed hotfix branch, now — never any reachable sha
            case "$WANT_VER" in ''|*[!0-9.]*) echo "::error title=source_ref::version must be digits and dots"; exit 1;; esac
            HEAD_NOW=$(git -C source ls-remote origin "refs/heads/hotfix/gsm-server/$WANT_VER" | cut -f1)
            [ -n "$HEAD_NOW" ] || { echo "::error title=source_ref::hotfix/gsm-server/$WANT_VER is not on origin — only a pushed hotfix branch builds"; exit 1; }
            [ "$HEAD_NOW" = "$WANT_REF" ] || { echo "::error title=source_ref::hotfix/gsm-server/$WANT_VER moved since dispatch; re-run the cut"; exit 1; }
            [ "$SHA" = "$WANT_REF" ] || { echo "::error title=source_ref::checked out $SHA, asked for $WANT_REF"; exit 1; }
            CFG=$(grep '^version:' source/gsm-server/config.yaml | sed 's/version: *"\(.*\)"/\1/')
            [ "$CFG" = "$WANT_VER" ] || { echo "::error title=source_ref::config.yaml at $SHA is $CFG, asked to build $WANT_VER"; exit 1; }
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "::notice title=source_sha::$SHA"

      - name: Extract version
        id: version
        env:
          IN_VER: ${{ github.event.inputs.version || github.event.client_payload.version }}
        run: |
          # P T2 2026-11-27 (W8): event values reach a script only through env — never an expression pasted into run
          if [ -n "$IN_VER" ]; then
            V="$IN_VER"
          else
            V=$(grep '^version:' source/gsm-server/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          fi
          case "$V" in ''|*[!0-9.]*) echo "::error title=version::the version must be digits and dots"; exit 1;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"


      - name: Sanity-check source version files match
        run: |
          CFG=$(grep -m1 '^version:' source/gsm-server/config.yaml | sed -E 's/.*"([^"]+)".*/\1/')
          INI=$(grep -m1 '__version__' source/gsm-server/gsm/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')
          V="${{ steps.version.outputs.version }}"
          [ "$CFG" = "$V" ] || { echo "::error::config.yaml version ($CFG) != build version ($V)"; exit 1; }
          [ "$INI" = "$V" ] || { echo "::error::__init__.py version ($INI) != build version ($V)"; exit 1; }
          echo "version files match: $V"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags (WR-PS-577 slice 5 — :latest only for a main build)
        id: tags
        env:
          IS_MAIN: ${{ needs.source-ref.outputs.is_main }}
          VER_TAG: ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-gsm-server:${{ steps.version.outputs.version }}
          LATEST_TAG: ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-gsm-server:latest
        run: |
          {
            echo "list<<PS_TAGS_EOF"
            echo "$VER_TAG"
            [ "$IS_MAIN" = true ] && echo "$LATEST_TAG"
            echo "PS_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build            # R197: exposes steps.build.outputs.digest
        uses: docker/build-push-action@v6
        with:
          context: source/gsm-server
          file:    source/gsm-server/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          # WR-PS-877: APT_REFRESH is a new key per run (and per re-run), so the apt-upgrade layer never comes from the cache
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          tags: ${{ steps.tags.outputs.list }}
          labels: org.opencontainers.image.revision=${{ steps.src.outputs.sha }}
          cache-from: type=gha,scope=gsm-server-${{ matrix.arch }}
          cache-to:   type=gha,scope=gsm-server-${{ matrix.arch }},mode=max

      # ── WR-PS-819 row 1 (R155) — scan the IMAGE JUST PUSHED, this arch's own digest (Peter ruled option (b) 2026-10-02;
      #    P prior sign-off 2026-10-10, C1-C3). Nothing scanned the built image before: the SBOM below reads the build
      #    CONTEXT, so the base image's OS packages were covered by nothing. Trivy reads the registry manifest for the
      #    digest, so the amd64 runner scans the aarch64 image without running it.
      #    C1: REPORT-ONLY (PS_IMAGE_SCAN_ENFORCE=0) until this add-on's first report is read and triaged — then "1".
      #    C2: the scanner is a pinned release binary verified by checksum, never a moving action tag.
      - name: Scan the pushed image for CVEs (trivy image — report-only until triaged)
        env:
          IMG: ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-gsm-server@${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          TRIVY_VERSION: "0.75.0"
          TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PS_IMAGE_SCAN_ENFORCE: "0"
          PS_IMAGE_SCAN_SEVERITY: "HIGH,CRITICAL"
        run: |
          set -uo pipefail
          enforce="${PS_IMAGE_SCAN_ENFORCE:-0}"
          na() {   # the scan could not run: never a pass — blocks when enforcing, a loud warning while report-only
            echo "::warning::image CVE scan NOT ASSESSED for $IMG — $1"
            [ "$enforce" = "1" ] && { echo "::error::image CVE scan could not run and this add-on ENFORCES it"; exit 1; }
            exit 0
          }
          if [ ! -x ./trivy ]; then
            curl -fsSL --retry 3 -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" || na "trivy download failed"
            echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c - || { echo "::error::trivy checksum mismatch — refusing to run an unverified scanner"; exit 1; }
            tar -xzf trivy.tgz trivy || na "trivy archive unreadable"
          fi
          # exit 10 = fixable findings at the gated severity; any other non-zero = the scan itself failed
          # GitHub runs this script with `bash -e`: a bare non-zero exit from trivy would end the step HERE, before the
          # report-only / NOT ASSESSED handling below (found by the WR-PS-819 C3 control run 37996426235: exit code 10).
          rc=0
          ./trivy image --quiet --platform "$PLATFORM" --scanners vuln --severity "${PS_IMAGE_SCAN_SEVERITY:-HIGH,CRITICAL}" \
            --ignore-unfixed --exit-code 10 --format table "$IMG" || rc=$?
          case "$rc" in
            0)  echo "image CVE scan: no ${PS_IMAGE_SCAN_SEVERITY:-HIGH,CRITICAL} finding with a fix available in $IMG" ;;
            10) if [ "$enforce" = "1" ]; then
                  echo "::error::image CVE scan: fixable ${PS_IMAGE_SCAN_SEVERITY:-HIGH,CRITICAL} finding(s) in $IMG (table above) — rebuild on a patched base or bump the package"; exit 1
                fi
                echo "::warning::image CVE scan (REPORT-ONLY, WR-PS-819 C1): fixable ${PS_IMAGE_SCAN_SEVERITY:-HIGH,CRITICAL} finding(s) in $IMG — table above. Not blocking until triaged." ;;
            *)  na "trivy exited $rc" ;;
          esac

      # ── R197 image provenance — canonical block (documentation/contracts/R197_PROVENANCE.md;
      #    validated WR-AS-020 / ASM-Pro #77). cosign verify exit = the gate (Rule 192).
      #    build-push-action's own provenance attestation is left at its DEFAULT, as in every other
      #    build-*.yml: with it the pushed tag is an OCI image INDEX. `provenance: false` (here since
      #    09f44e8, 2026-06-13) made GSM the only add-on publishing a bare single-image manifest, which
      #    `_arch-gate` probes as 404 → every GSM cut read "MISSING" (G, 2026-10-06, Peter: "gsm is the
      #    only addon that does this — find out why and change it"). cosign still attests out-of-band.
      - name: Install cosign + syft
        uses: sigstore/cosign-installer@v3

      - name: Generate CycloneDX SBOM
        # WR-AS-020 finding: scan the build CONTEXT filesystem, not image:@digest — syft on
        # the amd64 runner can't pull an aarch64-only image variant (GSM is amd64-only today,
        # but keep the filesystem-scan pattern for fleet uniformity + future aarch64 add).
        uses: anchore/sbom-action@v0
        with:
          path: source/gsm-server
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Sign + attest + verify (fail-closed = the R197 gate)
        env:
          COSIGN_YES: "true"
          IMG: ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-gsm-server@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # WR-PS-420: Rekor (Sigstore's transparency log) intermittently 404s on
          # GET /api/v1/log/entries/{entryUUID} right after a signature is submitted —
          # eventual consistency, not a signing fault. It failed two consecutive releases
          # on 2026-08-03, on a DIFFERENT arch each time. Retry only the cosign calls that
          # touch Rekor. Fail-closed is preserved: when attempts are exhausted the failure
          # stands, the step exits non-zero and NO image is published (R197).
          retry() {
            local n=1 max=5 delay=15
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "::error::cosign failed after $max attempts: $*"
                return 1
              fi
              echo "::warning::attempt $n/$max failed (likely Rekor eventual-consistency); retry in ${delay}s"
              n=$((n + 1)); sleep "$delay"; delay=$((delay * 2))
            done
          }
          retry cosign sign "$IMG"
          retry cosign attest --predicate sbom.cdx.json --type cyclonedx "$IMG"
          retry cosign verify "$IMG" \
            --certificate-identity-regexp '^https://github\.com/PaddiSense/public/\.github/workflows/build-.+\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            >/dev/null
          retry cosign verify-attestation "$IMG" --type cyclonedx \
            --certificate-identity-regexp '^https://github\.com/PaddiSense/public/\.github/workflows/build-.+\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            >/dev/null

      - name: Summary
        run: |
          {
            echo "## ${{ matrix.arch }} build complete"
            echo ""
            echo "**Image:** \`${IMAGE_BASE}/${{ matrix.arch }}-gsm-server:${{ steps.version.outputs.version }}\`"
            [ "${{ needs.source-ref.outputs.is_main }}" = true ] && echo "**Also tagged:** \`:latest\`" || echo "**Source:** commit \`${{ steps.src.outputs.sha }}\` (not main — no \`:latest\`)"
            echo "**Platform:** ${{ matrix.platform }}"
            echo "**Quality gates:** ruff + mypy + bandit + pip-audit + pytest — ALL PASSED"
            echo ""
            echo "ADR-004 Phase A — no production change. Phase B (public addon"
            echo "config) lives at \`gsm-server/config.yaml\` in this repo;"
            echo "bump its \`version:\` field to consume this image on next supervisor refresh."
          } >> "$GITHUB_STEP_SUMMARY"
