name: Build PaddiSense Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build"
        required: true
  repository_dispatch:
    types: [build-store]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/paddisense

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/Store
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: source

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "\$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.client_payload.version }}" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> "\$GITHUB_OUTPUT"
          else
            VERSION=$(grep '^version:' source/paddisense-store/config.yaml | sed 's/version: *"\(.*\)"/\1/')
            echo "version=\$VERSION" >> "\$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: source/paddisense-store
          file: source/paddisense-store/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-store:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-store:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
