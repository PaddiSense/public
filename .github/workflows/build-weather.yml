name: Build PaddiSense Weather

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build"
        required: true
  repository_dispatch:
    types: [build-weather]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/paddisense

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/Weather
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r source/paddisense-weather/requirements.txt
          pip install ruff bandit

      - name: Ruff lint check
        run: ruff check source/paddisense-weather/paddisense_weather

      - name: Bandit security scan
        run: bandit -r source/paddisense-weather/paddisense_weather -ll -q || true

  build:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/Weather
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: source

      - name: Inject canonical theme (build-injection — ADR-007)
        uses: actions/checkout@v4
        with:
          repository: PaddiSense/documentation
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: docs-theme
          sparse-checkout: theme/paddisense-tokens.css
          sparse-checkout-cone-mode: false
      - name: Overlay canonical theme into source
        run: |
          cp docs-theme/theme/paddisense-tokens.css source/paddisense-weather/paddisense_weather/static/paddisense-tokens.css
          SHA=$(git -C docs-theme rev-parse --short HEAD)
          echo "theme-source=PaddiSense/documentation@${SHA} built=$(date -u +%FT%TZ)" > source/paddisense-weather/paddisense_weather/static/.theme-build-info
          echo "Injected theme from documentation@${SHA}"

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.client_payload.version }}" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep '^version:' source/paddisense-weather/config.yaml | sed 's/version: *"\(.*\)"/\1/')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: source/paddisense-weather
          file: source/paddisense-weather/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-weather:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-paddisense-weather:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
